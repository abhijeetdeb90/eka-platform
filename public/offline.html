<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — EKA Platform</title>
  <meta name="theme-color" content="#78350f">
  <style>
    :root {
      --bg: #faf8f5;
      --card-bg: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --terracotta: #c25e36;
      --terracotta-dark: #944322;
      --sand: #f5f0e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --card-bg: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --border: #292524;
        --terracotta: #d97745;
        --terracotta-dark: #b85b28;
        --sand: #1c1917;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 20px;
      background: var(--sand);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--terracotta);
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.85rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: #ffffff;
      background-color: var(--terracotta);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .btn-primary:hover {
      background-color: var(--terracotta-dark);
    }
    .quick-links {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
    .quick-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .quick-links a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon-wrapper">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.829-2.829m0 0L3 21m2.829-5.636A5 5 0 018.464 8.464m0 0L12 12m-6.364-6.364L3 3m18 0l-3.636 3.636" />
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>
      EKA's cached library and living lineages remain preserved on your device. Once your signal reconnects, live inquiry and synchronization will resume automatically.
    </p>
    <div class="actions">
      <button class="btn-primary" onclick="window.location.reload()">
        Try Reconnecting
      </button>
    </div>
    <div class="quick-links">
      <a href="/">Home</a>
      <a href="/discover">Discover</a>
      <a href="/stories">Stories</a>
      <a href="/ask">Ask EKA</a>
    </div>
  </main>
</body>
</html>
