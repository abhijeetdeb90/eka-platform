<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- EKA Canonical Horizontal Lockup (Light Background) -->
  <defs>
    <linearGradient id="ekaCoreLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C25E3E"/>
      <stop offset="100%" stop-color="#9E472A"/>
    </linearGradient>
    <mask id="hMaskLight">
      <rect width="64" height="64" fill="#FFFFFF"/>
      <circle cx="32" cy="32" r="10" fill="#000000"/>
    </mask>
  </defs>

  <!-- 1. CULTURAL MERIDIAN EMBLEM (Left, 64x64 bounds) -->
  <g id="eka-symbol-light">
    <!-- Outer Globe Ring -->
    <circle cx="32" cy="32" r="26" stroke="#1E2A38" stroke-width="2.75"/>

    <!-- Masked Interior Meridians -->
    <g mask="url(#hMaskLight)" stroke="#1E2A38" stroke-width="2.75" stroke-linecap="round">
      <line x1="6" y1="32" x2="58" y2="32"/>
      <path d="M 32 6 C 43 16, 43 48, 32 58"/>
      <path d="M 32 6 C 21 16, 21 48, 32 58"/>
    </g>

    <!-- Cardinal Meridian Nodes -->
    <circle cx="32" cy="6" r="1.75" fill="#C25E3E"/>
    <circle cx="58" cy="32" r="1.75" fill="#C25E3E"/>
    <circle cx="32" cy="58" r="1.75" fill="#C25E3E"/>
    <circle cx="6" cy="32" r="1.75" fill="#C25E3E"/>

    <!-- The "One Within" Focal Core -->
    <circle cx="32" cy="32" r="5.5" fill="url(#ekaCoreLight)"/>
  </g>

  <!-- 2. TYPOGRAPHIC LOGOTYPE & DESCRIPTOR -->
  <g id="eka-logotype-light" transform="translate(74, 0)">
    <!-- Primary Mark: EKA -->
    <text x="0" y="36" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="28" 
          letter-spacing="0.22em" 
          fill="#1E2A38">EKA</text>
    
    <!-- Secondary Product Positioning: CULTURAL INTELLIGENCE -->
    <text x="1" y="49" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="600" 
          font-size="7.5" 
          letter-spacing="0.28em" 
          fill="#64748B">CULTURAL INTELLIGENCE</text>
  </g>
</svg>
