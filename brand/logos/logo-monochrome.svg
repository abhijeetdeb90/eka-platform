<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- EKA Canonical Horizontal Lockup (Monochrome currentColor) -->
  <defs>
    <mask id="hMaskMono">
      <rect width="64" height="64" fill="#FFFFFF"/>
      <circle cx="32" cy="32" r="10" fill="#000000"/>
    </mask>
  </defs>

  <!-- 1. CULTURAL MERIDIAN EMBLEM (Left, 64x64 bounds) -->
  <g id="eka-symbol-mono">
    <!-- Outer Globe Ring -->
    <circle cx="32" cy="32" r="26" stroke="currentColor" stroke-width="2.75"/>

    <!-- Masked Interior Meridians -->
    <g mask="url(#hMaskMono)" stroke="currentColor" stroke-width="2.75" stroke-linecap="round">
      <line x1="6" y1="32" x2="58" y2="32"/>
      <path d="M 32 6 C 43 16, 43 48, 32 58"/>
      <path d="M 32 6 C 21 16, 21 48, 32 58"/>
    </g>

    <!-- Cardinal Meridian Nodes -->
    <circle cx="32" cy="6" r="1.75" fill="currentColor"/>
    <circle cx="58" cy="32" r="1.75" fill="currentColor"/>
    <circle cx="32" cy="58" r="1.75" fill="currentColor"/>
    <circle cx="6" cy="32" r="1.75" fill="currentColor"/>

    <!-- The "One Within" Focal Core -->
    <circle cx="32" cy="32" r="5.5" fill="currentColor"/>
  </g>

  <!-- 2. TYPOGRAPHIC LOGOTYPE & DESCRIPTOR -->
  <g id="eka-logotype-mono" transform="translate(74, 0)">
    <!-- Primary Mark: EKA -->
    <text x="0" y="36" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="28" 
          letter-spacing="0.22em" 
          fill="currentColor">EKA</text>
    
    <!-- Secondary Product Positioning: CULTURAL INTELLIGENCE -->
    <text x="1" y="49" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="600" 
          font-size="7.5" 
          letter-spacing="0.28em" 
          fill="currentColor" 
          opacity="0.75">CULTURAL INTELLIGENCE</text>
  </g>
</svg>
