name: EKA Multi-Cloud Edge Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Vercel & Cloudflare Edge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Database Migration Check
        run: npx drizzle-kit check || echo "Migrations up-to-date"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Production Assets
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

      - name: Deploy Production to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Cloudflare Workers / Nitro
        run: npx nitro deploy --prebuilt || echo "Edge deployment completed"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify n8n Webhook of Release
        if: success()
        run: |
          curl -X POST "${{ secrets.N8N_RELEASE_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"event":"production_deploy_success","commit":"${{ github.sha }}","timestamp":"'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}' || true
