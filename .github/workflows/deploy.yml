name: EKA Vercel Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eka-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy and smoke-test production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -eu
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN secret is missing"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID secret is missing"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID secret is missing"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build
        env:
          NODE_ENV: production
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

      - name: Link Vercel production project
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel production output
        run: npx vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -uo pipefail
          set +e
          timeout 150s npx vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee /tmp/vercel-deploy.log
          deploy_status=${PIPESTATUS[0]}
          set -e

          # Vercel CLI may wait on project checks even after it reports the deployment completed.
          # Treat a timeout as non-fatal only when the CLI explicitly reported completion.
          if grep -q "Deployment completed" /tmp/vercel-deploy.log; then
            echo "Vercel reported deployment completion."
          else
            echo "::error::Vercel did not confirm deployment completion (CLI exit: $deploy_status)."
            exit 1
          fi

          DEPLOYMENT_URL="$(grep -Eo 'https://eka-platform-[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1 || true)"
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Could not extract the new deployment URL from Vercel CLI output."
            exit 1
          fi
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "New deployment URL: $DEPLOYMENT_URL"

      - name: Verify new deployment and production alias
        run: |
          set -eu
          for url in "$DEPLOYMENT_URL" "https://eka-platform.vercel.app/"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --retry 10 --retry-delay 6 --retry-connrefused \
              --max-time 30 "$url" --output /tmp/eka-production.html
            grep -qi '<html' /tmp/eka-production.html
          done
          echo "New deployment URL and production alias both returned HTML successfully."
