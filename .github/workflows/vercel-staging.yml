name: EKA Vercel Staging & Preview Deployment

on:
  push:
    branches:
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: vercel_staging_${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-preview-deploy:
    name: Build & Deploy Preview to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Quality Gate
        run: npx tsc --noEmit

      - name: Verify staging Supabase build target
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -eu
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is required for a trusted preview build"; exit 1; }
          test "$VITE_SUPABASE_URL" = "https://xjotvcigjetmlpjcjytp.supabase.co" || { echo "::error::Preview builds must target EKA-Staging, never production Supabase"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is required for a trusted preview build"; exit 1; }
          test "$VITE_SUPABASE_PUBLISHABLE_KEY" != "placeholder-anon-key" || { echo "::error::Placeholder Supabase keys cannot be deployed"; exit 1; }

      - name: Build Staging Preview
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}

      # Secrets are intentionally unavailable to pull_request workflows from forks
      # and some dependency-update bots. Keep their build/quality checks, but only
      # attempt authenticated Vercel preview deployment when credentials are available.
      - name: Verify Vercel deployment secrets
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -eu
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN secret is missing for a trusted preview deployment"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID secret is missing for a trusted preview deployment"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID secret is missing for a trusted preview deployment"; exit 1; }

      - name: Skip preview deploy for untrusted pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "::notice::Build and quality checks passed; authenticated preview deployment is skipped because GitHub does not expose repository secrets to this pull request."

      - name: Deploy Preview to Vercel
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -eu
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
