name: EKA Vercel Staging & Preview Deployment

on:
  push:
    branches:
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: vercel_staging_${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-preview-deploy:
    name: Build & Deploy Preview to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Quality Gate
        run: npx tsc --noEmit

      - name: Evaluate isolated staging deployment configuration
        id: preview_config
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -eu
          reason=""
          if [ "$VITE_SUPABASE_URL" != "https://xjotvcigjetmlpjcjytp.supabase.co" ]; then
            reason="VITE_SUPABASE_URL must target the EKA-Staging project"
          elif [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || [ "$VITE_SUPABASE_PUBLISHABLE_KEY" = "placeholder-anon-key" ]; then
            reason="VITE_SUPABASE_PUBLISHABLE_KEY is missing or is a placeholder"
          elif [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            reason="Vercel deployment secrets are missing"
          fi

          if [ -n "$reason" ]; then
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview deployment intentionally skipped: $reason. Build and CI checks will still run; no deployment was created."
          else
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging Supabase target and Vercel deployment credentials are configured."
          fi

      - name: Build Staging Preview
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder-anon-key' }}

      # Secrets are intentionally unavailable to pull_request workflows from forks
      # and some dependency-update bots. Keep their build/quality checks, but only
      # attempt authenticated Vercel preview deployment when credentials are available.
      - name: Skip preview deploy for untrusted pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "::notice::Build and quality checks passed; authenticated preview deployment is skipped because GitHub does not expose repository secrets to this pull request."

      - name: Deploy Preview to Vercel
        if: ${{ steps.preview_config.outputs.deploy_enabled == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          set -eu
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
